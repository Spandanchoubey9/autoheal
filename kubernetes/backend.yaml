apiVersion: v1
kind: Service
metadata:
  name: autoheal-backend
spec:
  selector:
    app: autoheal-backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoheal-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoheal-backend
  template:
    metadata:
      labels:
        app: autoheal-backend
    spec:
      imagePullSecrets:
        - name: ecr-registry
      containers:
        - name: backend
          image: 143765648738.dkr.ecr.us-east-1.amazonaws.com/autoheal-backend:build-1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: autoheal-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: autoheal_db
            - name: DB_USER
              value: autoheal_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: autoheal-db-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
