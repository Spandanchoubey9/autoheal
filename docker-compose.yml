services:
  postgres:
    image: postgres:16
    container_name: autoheal-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: autoheal_user
      POSTGRES_DB: autoheal_db
    ports:
      - "5434:5432"
    volumes:
      - autoheal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoheal_user -d autoheal_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autoheal-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: autoheal_db
      DB_USER: autoheal_user
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autoheal-frontend
    restart: unless-stopped
    ports:
      - "85:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  autoheal-postgres-data:
